[package]
name = "saturn-server"
description = "Saturn's local HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.3", features = ["std"] }
saturn-core = { path = "../saturn-core" }
saturn-domain = { path = "../saturn-domain" }
saturn-store = { path = "../saturn-store" }
saturn-telemetry = { path = "../saturn-telemetry" }
saturn-tools = { path = "../saturn-tools" }
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
url = "2"
