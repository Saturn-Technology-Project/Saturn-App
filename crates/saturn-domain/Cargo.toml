[package]
name = "saturn-domain"
description = "Saturn's rules: what an agent may do, with no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = { version = "0.3", features = ["std"] }
# The calendar: dates, days and clock times in UTC. Time zones are saturn-core's.
jiff = { version = "0.2", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
# The line diff behind the reviews of agent edits.
similar = { version = "3", default-features = false }
url = "2"
