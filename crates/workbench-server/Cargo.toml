[package]
name = "workbench-server"
description = "Eisoptric Workbench's local HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.4", features = ["std"] }
workbench-appcontainer = { path = "../workbench-appcontainer" }
workbench-core = { path = "../workbench-core" }
workbench-domain = { path = "../workbench-domain" }
workbench-store = { path = "../workbench-store" }
workbench-telemetry = { path = "../workbench-telemetry" }
workbench-tools = { path = "../workbench-tools" }
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
url = "2"
