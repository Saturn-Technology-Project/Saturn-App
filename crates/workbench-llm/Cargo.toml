[package]
name = "workbench-llm"
description = "Eisoptric Workbench's one door to every model provider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
percent-encoding = "2"
regex = "1"
# The operating system's TLS, so its trusted certificates apply and no C toolchain is needed on macOS or Windows.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
workbench-domain = { path = "../workbench-domain" }
workbench-store = { path = "../workbench-store" }
workbench-telemetry = { path = "../workbench-telemetry" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
