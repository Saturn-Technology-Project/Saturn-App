[package]
name = "saturn-llm"
description = "Saturn's one door to every model provider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regex = "1"
# The operating system's TLS, so its trusted certificates apply and no C toolchain is needed on macOS or Windows.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
saturn-domain = { path = "../saturn-domain" }
saturn-store = { path = "../saturn-store" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
