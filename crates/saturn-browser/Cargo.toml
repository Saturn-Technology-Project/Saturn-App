[package]
name = "saturn-browser"
description = "The browser an agent drives: Chrome through the DevTools protocol, Safari through WebDriver, a live view and recordings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
saturn-domain = { path = "../saturn-domain" }
saturn-telemetry = { path = "../saturn-telemetry" }
saturn-tools = { path = "../saturn-tools" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt", "sync", "time"] }
# The DevTools protocol's connection, only ever to the browser on this computer, so without TLS.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
