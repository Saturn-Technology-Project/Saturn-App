[package]
name = "workbench-cli"
description = "The `workbench` command: the running the app from a terminal or a script"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
percent-encoding = "2"
# Only ever to the runtime on this computer, so without TLS.
reqwest = { version = "0.13", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["macros", "rt"] }
