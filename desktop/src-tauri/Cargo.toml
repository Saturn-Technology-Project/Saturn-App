[package]
name = "saturn-desktop"
description = "The Saturn desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "2.14.1"
tokio = { version = "1", features = ["io-util", "net", "time"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
mac-notification-sys = "=0.6.15"
macos-accessibility-client = "0.0.2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
