# The Rust rewrite of Saturn's runtime (see contract/ for what it must keep doing).
[workspace]
resolver = "3"
members = ["crates/*", "desktop/src-tauri"]
# The desktop app needs a web view to build, so plain cargo commands leave it out; use -p saturn-desktop.
default-members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
strip = true
