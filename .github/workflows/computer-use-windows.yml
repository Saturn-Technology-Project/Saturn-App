name: Computer use (Windows)

# Drives Notepad on a real Windows desktop through Saturn's computer-use tools: screenshots, the UI Automation tree,
# Unicode typing, shortcuts, clicks and scrolling. Runs on its own (a few minutes).

on:
  push:
    branches: [main]
    paths:
      - "crates/saturn-computer/**"
      - ".github/workflows/computer-use-windows.yml"
  workflow_dispatch:

concurrency:
  group: computer-use-windows-${{ github.ref }}
  cancel-in-progress: true

# Read-only: these jobs check out, build and test; nothing is pushed or published.
permissions:
  contents: read

jobs:
  notepad:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Drive Notepad
        env:
          SATURN_TEST_DESKTOP: "1"
        run: cargo test --locked -p saturn-computer --test notepad
