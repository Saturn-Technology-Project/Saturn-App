name: Fuzz

# Feeds the parsers that read text Eisoptric Workbench did not write (an agent's patch, a hook's answer, a project's skill file and
# the Windows sandbox launcher's command line) with generated input for a few minutes each, on changes to them and
# weekly. A crash fails the run and its input is kept as an artifact. Targets are in fuzz/.

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/workbench-domain/**"
      - "crates/workbench-appcontainer/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [patch, hook_answer, skill_file, sandbox_launcher]
    env:
      # cargo-fuzz needs a nightly compiler for its instrumentation; a dated one, so a run does not change by itself.
      NIGHTLY: nightly-2026-11-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz@0.13.2

      - name: Fuzz for three minutes
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "corpus/$TARGET"
          # cargo-fuzz builds for the target it was itself built for unless told; the installed one is a musl build.
          cargo "+$NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$TARGET" "corpus/$TARGET" "seeds/$TARGET" -- -max_total_time=180

      - name: Keep the input that crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
