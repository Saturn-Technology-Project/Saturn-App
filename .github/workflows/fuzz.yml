name: Fuzz

# Feeds the parsers that read text Saturn did not write (an agent's patch, a hook's answer, a project's skill file and
# the Windows sandbox launcher's command line) with generated input for a few minutes each, on changes to them and
# weekly. A crash fails the run and its input is kept as an artifact. Targets are in fuzz/.

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/saturn-domain/**"
      - "crates/saturn-appcontainer/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [patch, hook_answer, skill_file, sandbox_launcher]
    env:
      # cargo-fuzz needs a nightly compiler for its instrumentation; a dated one, so a run does not change by itself.
      NIGHTLY: nightly-2026-11-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-fuzz@0.13.2

      - name: Fuzz for three minutes
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "corpus/$TARGET"
          cargo "+$NIGHTLY" fuzz run "$TARGET" "corpus/$TARGET" "seeds/$TARGET" -- -max_total_time=180

      - name: Keep the input that crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
