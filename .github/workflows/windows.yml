name: Windows build

# Builds Saturn IDE for Windows (the Code-OSS fork's native modules must be compiled on Windows; they cannot be
# cross-built from a Mac), runs the IDE smoke test on it, then packages the Saturn installer with the IDE inside.
# Artifacts: the NSIS installer and a zip of the IDE build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Saturn-IDE/**"
      - "desktop/**"
      - "runtime/**"
      - ".github/workflows/windows.yml"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      # Keep the sources byte-for-byte as committed (LF): the packaged app and the tests expect it.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node for Saturn IDE (its .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: Saturn-IDE/.nvmrc

      - name: Install the IDE's dependencies
        working-directory: Saturn-IDE
        shell: pwsh
        run: npm ci
        env:
          npm_config_foreground_scripts: "1"
          # @vscode/ripgrep downloads its binary through the GitHub API; unauthenticated calls hit the runner's rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build Saturn IDE (win32-x64)
        working-directory: Saturn-IDE
        shell: pwsh
        run: npm run gulp vscode-win32-x64-min

      - name: Runtime and desktop dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # a failing command fails the step, not only the last one
          npm ci --ignore-scripts --prefix runtime
          npm ci --ignore-scripts --prefix desktop

      - name: Runtime tests and type checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # a failing command fails the step, not only the last one
          npm test --prefix runtime
          npm run typecheck
          npm run test:ide

      - name: IDE smoke test on the Windows build
        shell: pwsh
        run: node Saturn-IDE/test/smoke/smoke.mjs VSCode-win32-x64

      - name: Code-signing certificate (self-signed)
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: .github/scripts/windows-signing-cert.ps1

      - name: Package the Saturn installer (with the IDE inside)
        working-directory: desktop
        shell: pwsh
        run: npm run dist:win

      - name: Check the signatures
        shell: pwsh
        env:
          EXPECTED: ${{ secrets.WINDOWS_SIGNING_PFX && 'D285DA425077C16A3D115D61F9748AFA574BC786' || '' }}
        run: .github/scripts/check-windows-signatures.ps1 -Release desktop/release -Expected "$env:EXPECTED"

      - name: Zip the IDE build
        shell: pwsh
        run: Compress-Archive -Path VSCode-win32-x64 -DestinationPath "Saturn-IDE-win32-x64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saturn-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest*.yml
            Saturn-IDE-win32-x64.zip
          if-no-files-found: error
