name: Windows build

# Runs the tests on Windows and packages the Saturn installer. Artifact: the NSIS installer.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# Read-only: these jobs check out, build and test; nothing is pushed or published.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      # Keep the sources byte-for-byte as committed (LF): the packaged app and the tests expect it.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Desktop dependencies
        run: npm ci --ignore-scripts --prefix desktop

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Tests and type checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # a failing command fails the step, not only the last one
          cargo test --locked
          npm run typecheck

      - name: Code-signing certificate (self-signed)
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: .github/scripts/windows-signing-cert.ps1

      - name: Package the Saturn installer
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # a failing command fails the step, not only the last one
          npm run package -- --bundles nsis --config src-tauri/tauri.signing.json
          npm run archive

      - name: Check the signatures
        shell: pwsh
        env:
          EXPECTED: ${{ secrets.WINDOWS_SIGNING_PFX && 'D285DA425077C16A3D115D61F9748AFA574BC786' || '' }}
        run: .github/scripts/check-windows-signatures.ps1 -Release desktop/release -Expected "$env:EXPECTED"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturn-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.sha256
          if-no-files-found: error
