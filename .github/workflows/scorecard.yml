name: Scorecard

# OpenSSF Scorecard: an independent, automated score of this repository's security practices (branch
# protection, pinned dependencies, signed releases, CI tests, dangerous workflow patterns…). Results are
# published to the OpenSSF API (the README badge and https://scorecard.dev/viewer/?uri=github.com/Saturn-Technology-Project/Saturn-App)
# and appear under Security → Code scanning. It runs on the default branch only, weekly and after branch
# protection changes.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "29 5 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Upload the results to Security → Code scanning.
      security-events: write
      # Publish the results (the badge) with a signed statement of where they came from.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
