name: Supply chain

# Checks what Saturn installs and ships, on every change and weekly (so an advisory published against an unchanged
# dependency still fails the check):
# - every lock file resolves only to the npm registry, with sha512 integrity (scripts/check-lockfiles.mjs);
# - every installed package has a valid npm registry signature, and provenance where its publisher provides it;
# - no known high or critical vulnerability in what the runtime and the desktop app ship;
# - the Claude Code and Codex download manifest still pins exactly what the lock file says.
# It also enforces the coding standard (oxlint with .oxlintrc.json) on the runtime and the desktop app, and for the Rust
# rewrite: formatting, clippy and tests, cargo deny (crates.io only, advisories, licenses), and the HTTP contract
# (contract/) against both runtimes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: Saturn-IDE/.nvmrc

      - name: Lock files resolve only to the npm registry, with sha512 integrity
        run: node scripts/check-lockfiles.mjs

      - name: Install without running any install script
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix runtime
          npm ci --ignore-scripts --no-audit --no-fund --prefix desktop

      - name: Registry signatures and provenance
        run: |
          (cd runtime && npm audit signatures)
          (cd desktop && npm audit signatures)

      - name: No high or critical vulnerabilities in what ships
        run: |
          (cd runtime && npm audit --omit=dev --audit-level=high)
          (cd desktop && npm audit --omit=dev --audit-level=high)

      - name: The Claude Code and Codex download manifest matches the lock file
        working-directory: runtime
        run: npx tsx --import ./test/setup.ts --test --test-name-pattern="manifest pins" test/agent-programs.test.ts

      - name: Coding standard (oxlint)
        run: |
          npm run lint --prefix runtime
          npm run lint --prefix desktop

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Rust formatting, lints and tests
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets
          cargo test --locked

      - name: Crates resolve only to crates.io, with no known advisories
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

      - name: The route checklist matches the TypeScript runtime
        run: node scripts/contract-routes.mjs --check

      - name: Both runtimes keep the HTTP contract
        run: |
          cargo build --locked -p saturn-server
          SATURN_TEST_RUNTIME=ts node --test contract/*.test.mjs
          SATURN_TEST_RUNTIME=rust node --test contract/*.test.mjs
