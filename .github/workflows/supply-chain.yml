name: Supply chain

# Checks what Saturn installs and ships, on every change and weekly (so an advisory published against an unchanged
# dependency still fails the check):
# - every lock file resolves only to the npm registry, with sha512 integrity (scripts/check-lockfiles.mjs);
# - every installed package has a valid npm registry signature, and provenance where its publisher provides it;
# - no known high or critical vulnerability in what the desktop app ships.
# It also enforces the coding standard (oxlint with .oxlintrc.json) on the desktop app, and for the runtime: formatting,
# clippy and tests, cargo deny (crates.io only, advisories, licenses), and the HTTP contract (contract/).
#
# Pull requests require its `check` job. A push to main runs it through the Release workflow, which packages and
# releases only after it passes.

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Lock files resolve only to the npm registry, with sha512 integrity
        run: node scripts/check-lockfiles.mjs

      - name: Install without running any install script
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix desktop

      - name: Registry signatures and provenance
        working-directory: desktop
        run: npm audit signatures

      - name: No high or critical vulnerabilities in what ships
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high

      - name: Coding standard (oxlint)
        run: npm run lint --prefix desktop

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Rust formatting, lints and tests
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets
          cargo test --locked

      - name: Crates resolve only to crates.io, with no known advisories
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

      - name: The advisories left open are the same for cargo deny, OSV and Scorecard, and for people
        run: node --test scripts/advisories.test.mjs

      - name: The route checklist matches the runtime
        run: node scripts/contract-routes.mjs --check

      - name: Release decisions (version, notes)
        run: node --test scripts/release.test.mjs

      - name: The interface type-checks and keeps its rules
        run: |
          npm run typecheck
          node --test desktop/test/*.test.mjs

      - name: Bubblewrap, so experiment runs are tested inside the Linux sandbox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          # Ubuntu 24.04 turns off unprivileged user namespaces by default; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: The runtime keeps the HTTP contract
        # The contract takes two or three minutes. A test that hangs fails after two minutes with its name, a file
        # that leaves something open still ends, and the step as a whole cannot hold the job.
        timeout-minutes: 12
        run: |
          cargo build --locked -p saturn-server -p saturn-cli
          node --test --test-timeout=120000 --test-force-exit contract/*.test.mjs
