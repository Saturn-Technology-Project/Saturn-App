name: CodeQL

# Code scanning of the languages Saturn is written in, on every change and weekly (so a new query also looks at unchanged
# code). Results appear under Security → Code scanning. This replaces GitHub's default setup, whose API cannot choose
# Rust; the two cannot run together, so default setup stays off in the repository settings.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Upload the results to Security → Code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # Read from the source, so nothing is built and no install script runs.
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
