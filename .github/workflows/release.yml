name: Release

# Every push to main is checked, packaged for macOS (Apple Silicon) and Windows (x64), and released when its version
# is new:
#
#   1. check     the whole Supply chain check (lint, types, Rust tests, cargo deny, the HTTP contract), the same job
#                pull requests must pass.
#   2. version   reads the version from desktop/package.json (Cargo.toml must agree). It releases when that version is
#                newer than every v* tag; an older one fails, an existing one only packages.
#   3. macos-test, windows-test   the Rust tests (and on macOS the HTTP contract) on that system, beside the check.
#   4. worker    the SSH worker for Linux hosts (x86-64 and ARM): this version's saturn-server, built on Ubuntu 22.04 so
#                older systems run it, started once, hashed and attested. worker-pins hands the hashes to the packages.
#   5. macos, windows   package, sign and attest, once the check and that system's tests pass. The runtime in each is
#                built with the workers' hashes, so it installs on a host only a worker that matches. The files are
#                kept as workflow artifacts. A failure here is run again on its own with "Re-run failed jobs".
#   6. release   only for a new version: tags the commit v<version> and publishes the release, with its notes from
#                .github/release-notes.md and the CHANGELOG section for the version (or Unreleased).
#
# To release: node scripts/set-version.mjs <version> (Cargo.toml, desktop/package.json and their lock files), give the
# CHANGELOG that version's section, and merge to main.
# Pushing a v* tag that matches the files, or running the workflow by hand, does the same.
#
# Run by hand, "platforms" can test and package one system alone, to try a fix; a release needs both.
#
# Versions below 1.0.0 and versions with a suffix (v1.2.0-rc.1) are published as pre-releases.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release if the version is new (off: only check and package)"
        type: boolean
        default: true
      platforms:
        description: "Which systems to test and package; a release needs both"
        type: choice
        options: [both, macos, windows]
        default: both

concurrency:
  # One release run at a time per branch or tag; a newer push to main waits rather than cancelling a publish.
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; each job asks for what it needs (OpenSSF Scorecard's Token-Permissions).
permissions:
  contents: read

jobs:
  check:
    name: Check
    uses: ./.github/workflows/supply-chain.yml

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, to compare the version with what is already released.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Which version, and whether it releases
        id: decide
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/release-version.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/release-version.mjs
          fi

  # Each system is tested and packaged in jobs of their own, so a packaging or signing failure can be run again on its
  # own ("Re-run failed jobs") without the tests, and the tests run beside the check rather than after it.
  macos-test:
    name: macOS (arm64) · test
    if: inputs.platforms != 'windows'
    # GitHub no longer runs macos-14 jobs. The app still supports macOS 12 and later (minimumSystemVersion).
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Desktop dependencies
        run: npm ci --ignore-scripts --prefix desktop

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      # Only the test jobs keep a build cache. The package jobs build from clean, so nothing a cache holds reaches a
      # signed download.
      - name: Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-test-${{ runner.os }}-

      - name: Git identity for the tests
        run: |
          git config --global user.name "Saturn CI"
          git config --global user.email "ci@saturn.invalid"

      - name: Rust tests
        run: cargo test --locked --no-fail-fast

      - name: The HTTP contract
        run: |
          cargo build --locked -p saturn-server -p saturn-cli
          node --test --test-timeout=120000 --test-force-exit contract/*.test.mjs

      - name: Type checks
        run: npm run typecheck

  worker:
    name: Worker (${{ matrix.target }})
    needs: [version]
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      # The runtime reaches HTTPS through the system's OpenSSL, so the host needs libssl 3 (Ubuntu 22.04, Debian 12,
      # RHEL 9 and later).
      - name: OpenSSL headers
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libssl-dev pkg-config

      - name: Build the worker
        run: cargo build --release --locked -p saturn-server

      - name: Name it for the release, and start it once
        id: named
        run: |
          name="saturn-worker-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p worker
          cp target/release/saturn-server "worker/$name"
          (cd worker && sha256sum "$name" > "$name.sha256")
          printf '%s' "{\"action\":\"check\",\"workdir\":\"$PWD\"}" | "./worker/$name" --research-worker | tee check.json
          grep -q '"version":"${{ needs.version.outputs.version }}"' check.json
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: worker/${{ steps.named.outputs.name }}

      - name: Keep the signed attestation
        run: cp "${{ steps.attest.outputs.bundle-path }}" "worker/${{ steps.named.outputs.name }}.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturn-worker-${{ matrix.target }}
          path: worker/
          if-no-files-found: error

  worker-pins:
    name: Worker hashes
    needs: [worker]
    runs-on: ubuntu-latest
    outputs:
      pins: ${{ steps.pins.outputs.pins }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: saturn-worker-*
          path: worker
          merge-multiple: true

      - name: target=sha256 for each worker
        id: pins
        run: |
          pins=""
          for file in worker/saturn-worker-*.sha256; do
            hash=$(cut -d' ' -f1 "$file")
            target=$(basename "$file" .sha256 | sed -E 's/^saturn-worker-.*-(linux-[a-z0-9]+)$/\1/')
            pins="${pins:+$pins,}$target=$hash"
          done
          echo "$pins"
          test "$(echo "$pins" | tr ',' '\n' | wc -l)" -eq 2
          echo "pins=$pins" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (arm64) · package
    needs: [check, version, macos-test, worker-pins]
    runs-on: macos-15
    permissions:
      contents: read
      # Build provenance: anyone can check a download was built by this workflow from this repository.
      id-token: write
      attestations: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Desktop dependencies
        run: npm ci --ignore-scripts --prefix desktop

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Package Saturn.app
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.SATURN_UPDATER_PUBKEY }}
          # Built into the runtime: the only Linux workers it will install on an SSH host.
          SATURN_WORKER_SHA256: ${{ needs.worker-pins.outputs.pins }}
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run package -- --bundles app $(node scripts/updater-config.mjs)
          npm run archive

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*-update.tar.gz

      # The signed attestation (a Sigstore bundle) ships beside the downloads, so it can be checked offline:
      # gh attestation verify <file> --bundle <bundle> -R Saturn-Technology-Project/Saturn-App
      - name: Keep the signed attestation
        run: cp "${{ steps.attest.outputs.bundle-path }}" "desktop/release/Saturn-${{ steps.version.outputs.version }}-mac-arm64.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturn-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.dmg.sha256
            desktop/release/*.zip
            desktop/release/*.zip.sha256
            desktop/release/*-update.tar.gz
            desktop/release/*-update.tar.gz.sha256
            desktop/release/updater-*.json
            desktop/release/*.sigstore.json
          if-no-files-found: error

  windows-test:
    name: Windows (x64) · test
    if: inputs.platforms != 'macos'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Keep the sources byte-for-byte as committed (LF): the packaged app and the tests expect it.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Desktop dependencies
        run: npm ci --ignore-scripts --prefix desktop

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      # Only the test jobs keep a build cache. The package jobs build from clean, so nothing a cache holds reaches a
      # signed download.
      - name: Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-test-${{ runner.os }}-

      - name: Git identity for the tests
        run: |
          git config --global user.name "Saturn CI"
          git config --global user.email "ci@saturn.invalid"

      - name: Rust tests
        run: cargo test --locked --no-fail-fast

      - name: Type checks
        run: npm run typecheck

  windows:
    name: Windows (x64) · package
    needs: [check, version, windows-test, worker-pins]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 120
    steps:
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        shell: bash
        run: echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Desktop dependencies
        run: npm ci --ignore-scripts --prefix desktop

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Code-signing certificate (self-signed)
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: .github/scripts/windows-signing-cert.ps1

      - name: Package the Saturn installer
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.SATURN_UPDATER_PUBKEY }}
          # Built into the runtime: the only Linux workers it will install on an SSH host.
          SATURN_WORKER_SHA256: ${{ needs.worker-pins.outputs.pins }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # a failing command fails the step, not only the last one
          # The sign command names the script by its whole path, with no variable in it: Tauri runs it from
          # desktop/src-tauri, and NSIS runs it again inside makensis for the uninstaller, where "$" starts NSIS's own
          # variables.
          $script = (Join-Path $env:GITHUB_WORKSPACE '.github/scripts/sign-windows-file.ps1') -replace '\\', '/'
          $signing = Join-Path $env:RUNNER_TEMP 'tauri.signing.json'
          @{ bundle = @{ windows = @{ signCommand = "pwsh -NoProfile -File $script -File %1" } } } | ConvertTo-Json -Depth 4 | Set-Content -Path $signing
          Get-Content $signing
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          $updater = (node scripts/updater-config.mjs) -split ' ' | Where-Object { $_ }
          npm run package -- --bundles nsis --config $signing @updater
          npm run archive

      - name: Check the signatures
        shell: pwsh
        env:
          EXPECTED: ${{ secrets.WINDOWS_SIGNING_PFX && 'D285DA425077C16A3D115D61F9748AFA574BC786' || '' }}
        run: .github/scripts/check-windows-signatures.ps1 -Release desktop/release -Expected "$env:EXPECTED"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/release/*.exe

      - name: Keep the signed attestation
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" "desktop/release/Saturn-${{ steps.version.outputs.version }}-win-x64.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturn-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.sha256
            desktop/release/updater-*.json
            desktop/release/*.sigstore.json
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, worker, macos, windows]
    if: needs.version.outputs.release == 'true' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    # Publishing waits for a maintainer's approval (the "release" environment), and only v* tags or main may deploy.
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    permissions:
      # Create the release and upload its files.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Installed Saturns look here for updates. It is a release of its own because GitHub's "latest" link skips pre-releases.
      - name: Update manifest
        run: |
          version="${VERSION#v}"
          if ls dist/updater-*.json >/dev/null 2>&1; then
            node scripts/updater-manifest.mjs "$version" dist latest.json
          fi
          rm -f dist/updater-*.json

      - name: Software bill of materials (CycloneDX)
        run: |
          version="${VERSION#v}"
          node scripts/sbom.mjs "$version" "dist/Saturn-$version-sbom.cdx.json"
          (cd dist && sha256sum "Saturn-$version-sbom.cdx.json" > "Saturn-$version-sbom.cdx.json.sha256")

      - name: Attest the SBOM
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*-sbom.cdx.json

      - name: Keep the SBOM's signed attestation
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/Saturn-${VERSION#v}-sbom.cdx.json.sigstore.json"

      # Every signed provenance attestation of the release in one JSON-lines file, the name SLSA tools look for:
      # gh attestation verify <file> --bundle Saturn-<version>.intoto.jsonl -R Saturn-Technology-Project/Saturn-App
      - name: Provenance of the whole release
        run: |
          version="${VERSION#v}"
          for bundle in dist/*.sigstore.json; do jq -c . "$bundle"; done > "dist/Saturn-$version.intoto.jsonl"
          test -s "dist/Saturn-$version.intoto.jsonl"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          version="${VERSION#v}"
          tag="v$version"
          prerelease=""
          if [[ "$PRERELEASE" == "true" ]]; then prerelease="--prerelease"; fi
          node scripts/release-notes.mjs "$version" notes.md
          ls -la dist
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-running for an existing release replaces its files and keeps its notes.
            gh release upload "$tag" dist/* --clobber
          else
            # Creating the release tags this commit v<version>.
            gh release create "$tag" dist/* \
              --title "Saturn $tag" \
              --target "$GITHUB_SHA" \
              --notes-file notes.md \
              --generate-notes \
              $prerelease
          fi
          gh release view "$tag" --json url --jq .url
          if [[ -f latest.json ]]; then
            gh release view updates >/dev/null 2>&1 || gh release create updates --title "Saturn updates" --notes "What installed Saturns check for updates." --prerelease --target "$GITHUB_SHA"
            gh release upload updates latest.json --clobber
          fi
