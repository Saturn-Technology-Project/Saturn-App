name: Release

# Builds Saturn for macOS (Apple Silicon) and Windows (x64), each with Saturn IDE inside, tests both, and publishes a
# GitHub release with the downloads. Saturn IDE's native modules must be compiled on each platform, so each build
# runs on its own runner.
#
#   Push a tag:   git tag v0.2.0 && git push origin v0.2.0
#   Or run it:    Actions → Release → Run workflow (version, and whether to publish or only build)
#
# Versions below 1.0.0 and versions with a suffix (v1.2.0-rc.1) are published as pre-releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.2.0)"
        required: true
      publish:
        description: "Publish the GitHub release (off: only build and keep the files as workflow artifacts)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# Read-only by default; each job asks for what it needs (OpenSSF Scorecard's Token-Permissions).
permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    permissions:
      contents: read
      # Build provenance: anyone can check a download was built by this workflow from this repository.
      id-token: write
      attestations: write
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: Saturn-IDE/.nvmrc

      - name: Install the IDE's dependencies
        working-directory: Saturn-IDE
        run: npm ci
        env:
          npm_config_foreground_scripts: "1"
          # @vscode/ripgrep downloads its binary through the GitHub API; unauthenticated calls hit the runner's rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          # Native modules (@vscode/policy-watcher) use std::variant, which needs macOS 10.13 or later, but gyp
          # compiles them with -mmacosx-version-min=10.7. These flags come after gyp's, and the last one wins.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CFLAGS: "-mmacosx-version-min=11.0"
          CXXFLAGS: "-mmacosx-version-min=11.0"
          LDFLAGS: "-mmacosx-version-min=11.0"

      - name: Build Saturn IDE (darwin-arm64)
        working-directory: Saturn-IDE
        run: npm run gulp vscode-darwin-arm64-min

      - name: Runtime and desktop dependencies
        run: |
          npm ci --ignore-scripts --prefix runtime
          npm ci --ignore-scripts --prefix desktop

      - name: Git identity for the tests
        run: |
          git config --global user.name "Saturn CI"
          git config --global user.email "ci@saturn.invalid"

      - name: Tests and type checks
        run: |
          npm test --prefix runtime
          npm run typecheck
          npm run test:ide

      - name: IDE smoke test
        run: node Saturn-IDE/test/smoke/smoke.mjs "VSCode-darwin-arm64/Saturn IDE.app"

      - name: Package Saturn.app
        working-directory: desktop
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build
          npm run build:runtime
          npm run stage:runtime
          npm run fetch:model
          npx electron-builder --mac --publish never
          npm run archive:mac

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/release/*.dmg
            desktop/release/*.zip

      # The signed attestation (a Sigstore bundle) ships beside the downloads, so it can be checked offline:
      # gh attestation verify <file> --bundle <bundle> -R Saturn-Technology-Project/Saturn-App
      - name: Keep the signed attestation
        run: cp "${{ steps.attest.outputs.bundle-path }}" "desktop/release/Saturn-${{ steps.version.outputs.version }}-mac-arm64.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturn-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.dmg.sha256
            desktop/release/*.zip
            desktop/release/*.zip.sha256
            desktop/release/*.sigstore.json
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 180
    steps:
      # Keep the sources byte-for-byte as committed (LF): the packaged app and the tests expect it.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        shell: bash
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: Saturn-IDE/.nvmrc

      - name: Install the IDE's dependencies
        working-directory: Saturn-IDE
        shell: pwsh
        run: npm ci
        env:
          npm_config_foreground_scripts: "1"
          # @vscode/ripgrep downloads its binary through the GitHub API; unauthenticated calls hit the runner's rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build Saturn IDE (win32-x64)
        working-directory: Saturn-IDE
        shell: pwsh
        run: npm run gulp vscode-win32-x64-min

      - name: Runtime and desktop dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # a failing command fails the step, not only the last one
          npm ci --ignore-scripts --prefix runtime
          npm ci --ignore-scripts --prefix desktop

      - name: Git identity for the tests
        run: |
          git config --global user.name "Saturn CI"
          git config --global user.email "ci@saturn.invalid"

      - name: Tests and type checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # a failing command fails the step, not only the last one
          npm test --prefix runtime
          npm run typecheck
          npm run test:ide

      - name: IDE smoke test
        shell: pwsh
        run: node Saturn-IDE/test/smoke/smoke.mjs VSCode-win32-x64

      - name: Code-signing certificate (self-signed)
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: .github/scripts/windows-signing-cert.ps1

      - name: Package the Saturn installer
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true  # a failing command fails the step, not only the last one
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run dist:win

      - name: Check the signatures
        shell: pwsh
        env:
          EXPECTED: ${{ secrets.WINDOWS_SIGNING_PFX && 'D285DA425077C16A3D115D61F9748AFA574BC786' || '' }}
        run: .github/scripts/check-windows-signatures.ps1 -Release desktop/release -Expected "$env:EXPECTED"

      - name: Checksums
        working-directory: desktop/release
        shell: bash
        run: |
          for file in *.exe; do sha256sum "$file" > "$file.sha256"; done
          ls -la

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/release/*.exe

      - name: Keep the signed attestation
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" "desktop/release/Saturn-${{ steps.version.outputs.version }}-win-x64.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturn-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.sha256
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
            desktop/release/*.sigstore.json
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [macos, windows]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    # Publishing waits for a maintainer's approval (the "release" environment), and only v* tags or main may deploy.
    environment: release
    permissions:
      # Create the release and upload its files.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Software bill of materials (CycloneDX)
        run: |
          version="${VERSION#v}"
          node scripts/sbom.mjs "$version" "dist/Saturn-$version-sbom.cdx.json"
          (cd dist && sha256sum "Saturn-$version-sbom.cdx.json" > "Saturn-$version-sbom.cdx.json.sha256")

      - name: Attest the SBOM
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*-sbom.cdx.json

      - name: Keep the SBOM's signed attestation
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/Saturn-${VERSION#v}-sbom.cdx.json.sigstore.json"

      # Every signed provenance attestation of the release in one JSON-lines file, the name SLSA tools look for:
      # gh attestation verify <file> --bundle Saturn-<version>.intoto.jsonl -R Saturn-Technology-Project/Saturn-App
      - name: Provenance of the whole release
        run: |
          version="${VERSION#v}"
          for bundle in dist/*.sigstore.json; do jq -c . "$bundle"; done > "dist/Saturn-$version.intoto.jsonl"
          test -s "dist/Saturn-$version.intoto.jsonl"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${VERSION#v}"
          tag="v$version"
          # 0.x and suffixed versions (1.2.0-rc.1) are pre-releases; 1.0.0 and later without a suffix are not.
          prerelease=""
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease="--prerelease"; fi
          sed "s/__VERSION__/$version/g" .github/release-notes.md > notes.md
          ls -la dist
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-running for an existing release replaces its files and keeps its notes.
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "Saturn $tag" \
              --target "$GITHUB_SHA" \
              --notes-file notes.md \
              --generate-notes \
              $prerelease
          fi
          gh release view "$tag" --json url --jq .url
