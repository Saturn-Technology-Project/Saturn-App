# Dependency updates. Security updates arrive as soon as an advisory is published (repository setting); version
# updates come weekly, grouped, and only after a release has been public for a week, so a compromised or broken
# version that is pulled within days never reaches a pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /runtime
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # The runtime runs on the Node inside Electron (24 with Electron 43): its types follow that, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      runtime-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, runtime]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, desktop]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, rust]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
